# Load local .env file if present (works when app runs from backend/ or repo root)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/ticketrush}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT config
jwt.secret=DayLaChuoiBiMatCuaRiengToi2026
jwt.expiration=86400000

# OAuth2 Google Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend URL to receive OAuth2 token after Google login
app.oauth2.redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/auth}

# Server port
server.port=8080

# Email (SMTP) for registration and password reset
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}

# OTP/verification code settings (minutes)
app.auth.code-expiration-minutes=${APP_AUTH_CODE_EXPIRATION_MINUTES:10}

# Development fallback: set false to force real email delivery.
app.auth.dev-return-code=${APP_AUTH_DEV_RETURN_CODE:false}

# MinIO object storage
app.minio.enabled=${APP_MINIO_ENABLED:false}
app.minio.endpoint=${APP_MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${APP_MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${APP_MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${APP_MINIO_BUCKET:ticketrush-images}
app.minio.public-base-url=${APP_MINIO_PUBLIC_BASE_URL:http://localhost:9000}
app.local-storage.upload-dir=${APP_LOCAL_STORAGE_UPLOAD_DIR:uploads}
app.server.public-base-url=${APP_SERVER_PUBLIC_BASE_URL:http://localhost:8080}

# Event defaults
app.events.featured-limit=${APP_EVENTS_FEATURED_LIMIT:6}
